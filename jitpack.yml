jdk:
  - openjdk21
# -PjitpackBuild=true disables the wasmJs target for this build — see the comment in
# build.gradle.kts for why (publishing android + wasm-js together breaks JitPack's Gradle
# module metadata for downstream KMP consumers).
install:
  - ./gradlew clean assemble publishToMavenLocal -PjitpackBuild=true -Pgroup=com.github.automaciej -Pversion=$VERSION
